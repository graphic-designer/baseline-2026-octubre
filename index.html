<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Autenticación con CSS Baseline 2026 - Input</title>
  <style>
    @layer motor, base, componentes;

    @layer motor {
      @property --angle {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
      }

      :root {
        color-scheme: light dark;
        --h1: clamp(1.3rem, 2cqw + 0.8rem, 1.8rem);     
        --texto-principal: light-dark(oklch(0.25 0.02 240), oklch(0.92 0.01 240));
        --texto-secundario: light-dark(oklch(0.45 0.02 240), oklch(0.75 0.01 240));
        --borde-neutral: light-dark(oklch(0.85 0.01 240), oklch(0.35 0.02 240));
        --fondo-campo: light-dark(oklch(0.98 0.01 240), oklch(0.18 0.02 240));
        --estado-foco: light-dark(oklch(0.55 0.22 260), oklch(0.68 0.19 250));
        --estado-error: light-dark(oklch(0.55 0.22 20), oklch(0.65 0.20 20));
        --estado-exito: light-dark(oklch(0.55 0.18 140), oklch(0.65 0.16 140));
      }
    }

    @layer base {
      html, body {
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        background-color: var(--nav-color);
        color: var(--body-text);
        font-family: 'Lato', sans-serif;
        font-weight: 400;
      }

      body {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        min-height: 100vh;
        line-height: 1.6;
        padding: clamp(1rem, 3vw, 2rem);
      }

      h1 {
        font-size: var(--h1);
        color: light-dark(oklch(0.25 0.02 240), oklch(0.92 0.01 240));
      }
    }

    @layer componentes {
      .sr-only {
        position: absolute;
        width: 0.0625rem;
        height: 0.0625rem;
        padding: 0;
        margin: -0.0625rem;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @scope (.control-formulario) {
        :scope {
          border: none;
          padding: 0;
          margin: clamp(1rem, 2.5vw, 1.5rem) 0;
          display: flex;
          flex-direction: column-reverse;
        }

        .input-formulario {
          font-size: clamp(0.9rem, 0.5vw + 0.85rem, 1rem);
          padding: clamp(0.5rem, 1vw + 0.4rem, 0.75rem) clamp(0.75rem, 1.5vw + 0.5rem, 1rem);
          background-color: var(--fondo-campo);
          border: 0.125rem solid var(--borde-neutral);
          border-radius: clamp(0.25rem, 0.5vw + 0.15rem, 0.5rem);
          color: var(--texto-principal);
          outline: none;
          transition: border-color 0.15s ease;
        }

        .etiqueta-formulario::after {
          content: "Introduce tu identificador de usuario o usuaria";
          display: block;
          margin-bottom: clamp(0.35rem, 1vw + 0.25rem, 0.5rem);
          font-size: clamp(0.75rem, 0.5vw + 0.75rem, 0.875rem);
          color: var(--texto-secundario);
          transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), color 0.15s ease, opacity 0.15s ease;
          will-change: transform;
        }

        &:has(.input-formulario:focus) {
          .input-formulario {
            border-color: var(--estado-foco);
          }
          .etiqueta-formulario::after {
            content: "Usa caracteres alfanuméricos exclusivamente";
            color: var(--estado-foco);
            transform: translateY(0.125rem);
          }
        }

        &:has(.input-formulario:user-invalid) {
          .input-formulario {
            border-color: var(--estado-error);
          }
          .etiqueta-formulario::after {
            content: "Error: El formato no es válido (solo letras y números)";
            color: var(--estado-error);
            transform: translateY(0);
          }
        }

        &:has(.input-formulario:user-valid) {
          .input-formulario {
            border-color: var(--estado-exito);
          }
          .etiqueta-formulario::after {
            content: "¡Identificador válido!";
            color: var(--estado-exito);
            transform: translateY(0);
          }
        }
      }
    }
  </style>
</head>
<body>
  <h1>Autenticación</h1>
  <fieldset class="control-formulario">
    <label for="identificador" class="etiqueta-formulario">
      <span class="sr-only">Introduce tu identificador de usuario o usuaria</span>
    </label>
    <input 
      type="text" 
      id="identificador" 
      class="input-formulario" 
      required 
      pattern="[A-Za-z0-9]+" 
      placeholder="Ejemplo: Persona123"
    >
  </fieldset>
</body>
</html>
